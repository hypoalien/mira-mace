services:
  temporal:
    image: temporalio/temporal:latest
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal-data:/data

  worker:
    build:
      context: .
      target: worker
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
    volumes:
      - case-data:/app/data/cases
    depends_on:
      - temporal
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      PORT: 3000
    volumes:
      - case-data:/app/data/cases
    depends_on:
      - temporal

volumes:
  temporal-data:
  case-data:
